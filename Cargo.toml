[package]
name = "routex"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"

license = "MIT"
authors = ["dawson a957360688@gmail.com"]
repository = "https://github.com/Dawson-Jones/routex"
description = "IP routes, interface addresses and link MTU on Linux, macOS and Windows, and policy routing rules on Linux"
# Apple's route(8) sources, kept as a reference under their own license.
exclude = ["reference/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The first release known to have the IPv6 interface requests of macOS.
libc = "0.2.169"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route = "0.30"
netlink-packet-core = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
